name: FEMA disaster data pipeline

on:
  workflow_dispatch:
  schedule:
    # OpenFEMA refreshes regularly; run daily at 08:15 UTC.
    - cron: '15 8 * * *'
  push:
    branches:
      - redesign/overview-and-etl
    paths:
      - 'scripts/fema_etl.py'
      - '.github/workflows/fema-pipeline.yml'

permissions:
  contents: write

concurrency:
  group: fema-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Fetch and transform FEMA records
        run: python3 scripts/fema_etl.py
      - name: Commit refreshed public summary
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add data/fema-disasters.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh FEMA disaster declaration data"
            else
              echo "Generated data is unchanged."
              exit 0
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "Published refreshed FEMA data."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts; stopping without force-pushing." >&2
              exit 1
            fi

            echo "Remote branch advanced; refreshing from origin and regenerating data (attempt $((attempt + 1))/3)."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python3 scripts/fema_etl.py
          done
