name: FEMA disaster data pipeline

on:
  workflow_dispatch:
  schedule:
    # OpenFEMA refreshes regularly; run daily at 08:15 UTC.
    - cron: '15 8 * * *'
  push:
    branches:
      - redesign/overview-and-etl
    paths:
      - 'scripts/fema_etl.py'
      - '.github/workflows/fema-pipeline.yml'

permissions:
  contents: write

concurrency:
  group: fema-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and transform FEMA records
        run: python3 scripts/fema_etl.py
      - name: Commit refreshed public summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fema-disasters.json
          if git diff --cached --quiet; then
            echo "Generated data is unchanged."
          else
            git commit -m "Refresh FEMA disaster declaration data"
            git push
          fi
