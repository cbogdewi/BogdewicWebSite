<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 2rem 3rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 3rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World!</h1>
    </div>
  </body>
</html>
